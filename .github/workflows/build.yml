name: Build Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DashCompetitivoAudio-Binaries
        path: |
          build/App/DashCompetitivoAudio_artefacts/Release/
          build/Plugins/LoudnessCompressor/LoudnessCompressor_artefacts/Release/
