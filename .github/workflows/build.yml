name: CI/CD Build & Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-validate:
    name: Windows x64 Build & Test
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake Solution
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

    - name: Build All Targets (Parallel)
      run: |
        cmake --build build --config Release --parallel

    - name: Execute AudioGraphTests Diagnostic (Verbose)
      run: ctest --test-dir build -C Release -R AudioGraphTests -V

    - name: Execute Automated QA & Unit Tests (CTest)
      run: ctest --test-dir build -C Release --output-on-failure

    - name: Package NSIS Installer
      shell: pwsh
      run: |
        if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
          choco install nsis -y --no-progress
        }
        $makensis = if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") { "C:\Program Files (x86)\NSIS\makensis.exe" } else { "makensis" }
        New-Item -ItemType Directory -Force -Path "build\Installer" | Out-Null
        & $makensis "/DBUILD_DIR=$PWD\build" "/DOUT_FILE=$PWD\build\Installer\DashCompetitivoAudio-setup.exe" "Installer\installer.nsi"

    - name: Compute SHA-256 Checksums
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "build\Dist" | Out-Null
        if (Test-Path "build\Installer\DashCompetitivoAudio-setup.exe") {
          Copy-Item "build\Installer\DashCompetitivoAudio-setup.exe" "build\Dist\"
        }
        Get-ChildItem -Path "build\Dist" -File | ForEach-Object {
          $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
          "$hash  $($_.Name)" | Out-File -FilePath "build\Dist\SHA256SUMS.txt" -Append -Encoding utf8
        }

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DashCompetitivoAudio-Windows-x64
        path: |
          build/Installer/DashCompetitivoAudio-setup.exe
          build/Dist/SHA256SUMS.txt
          build/App/DashCompetitivoAudio_artefacts/Release/*.exe
        if-no-files-found: warn
